<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Offline</title>
    <style>
      /* Served by the service worker (public/sw.js) when a page is opened with no connection. Self-contained on purpose: no bundle, no fetches. Colors mirror src/index.css. */
      :root {
        --background: #f8f8fa;
        --foreground: #0c0c12;
        --muted-foreground: #63636f;
        --primary: #6d4aff;
      }
      :root[data-theme='dark'] {
        --background: #09090c;
        --foreground: #f4f4f6;
        --muted-foreground: #9d9daa;
        --primary: #7f63ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      svg {
        width: 44px;
        height: 44px;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted-foreground);
      }
      button {
        font: inherit;
        font-weight: 500;
        padding: 10px 20px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
    </style>
    <script>
      // Theme and language the person chose in the app, else the system's (keep in sync with index.html and src/i18n/index.ts).
      ;(() => {
        const read = (key) => {
          try {
            return localStorage.getItem(key)
          } catch {
            return null
          }
        }
        const theme = read('theme')
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        const saved = read('locale')
        const langs = [saved].concat(navigator.languages || [])
        let lang = 'en'
        for (let i = 0; i < langs.length; i++) {
          const tag = String(langs[i] || '').toLowerCase()
          if (tag.indexOf('vi') === 0) lang = 'vi'
          if (tag.indexOf('vi') === 0 || tag.indexOf('en') === 0) break
        }
        document.documentElement.lang = lang
        const text = {
          en: ['You are offline', 'Check your internet connection. This page reloads by itself once you are back online.', 'Try again'],
          vi: ['Bạn đang ngoại tuyến', 'Hãy kiểm tra kết nối mạng. Trang sẽ tự tải lại khi có mạng trở lại.', 'Thử lại'],
        }[lang]
        document.addEventListener('DOMContentLoaded', () => {
          document.title = text[0]
          document.getElementById('title').textContent = text[0]
          document.getElementById('hint').textContent = text[1]
          document.getElementById('retry').textContent = text[2]
        })
      })()
      addEventListener('online', () => location.reload())
    </script>
  </head>
  <body>
    <main role="status">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6d4aff" />
            <stop offset="1" stop-color="#d946ef" />
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="8" fill="url(#g)" />
        <path d="M22 9.5H11.5v13H22M11.5 16H20" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" />
      </svg>
      <h1 id="title">You are offline</h1>
      <p id="hint">Check your internet connection. This page reloads by itself once you are back online.</p>
      <button id="retry" type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
