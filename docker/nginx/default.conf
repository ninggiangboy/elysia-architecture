# Docker DNS returns every replica of `api`; the resolver + variable make nginx re-resolve periodically.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream http://api:3000;

  location /api/ {
    proxy_pass $api_upstream;
    # SSE (/api/realtime/events): HTTP/1.1, no buffering, long-lived connections.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /config.json {
    add_header Cache-Control "no-store";
  }

  # The service worker must be revalidated on every load, or a fixed worker would take a day to reach users.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri /index.html;
  }
}
