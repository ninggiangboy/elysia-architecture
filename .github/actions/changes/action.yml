name: Detect changed paths
description: >
  Reports which areas of the repo changed (see .github/filters.yml). Pull requests and pushes are filtered
  (a push is diffed against the commit before it, so the whole pushed range counts). Anything else (schedule,
  manual, or a push with no usable "before" such as a new branch) reports everything as changed.

outputs:
  code:
    description: Source or config changed (anything except docs-only changes)
    value: ${{ steps.result.outputs.code }}
  deps:
    description: Dependency manifests or lockfile changed
    value: ${{ steps.result.outputs.deps }}
  e2e:
    description: Anything the E2E suite exercises changed
    value: ${{ steps.result.outputs.e2e }}
  docker_matrix:
    description: JSON array of app names whose Docker image needs rebuilding
    value: ${{ steps.result.outputs.docker_matrix }}

# The caller must run actions/checkout first (a local action cannot be loaded without it).
runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@v3
      id: filter
      if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
      with:
        filters: .github/filters.yml
    - id: result
      shell: bash
      env:
        FILTERED: ${{ steps.filter.conclusion == 'success' }}
        CODE: ${{ steps.filter.outputs.code }}
        DEPS: ${{ steps.filter.outputs.deps }}
        E2E: ${{ steps.filter.outputs.e2e }}
        IMAGE_API: ${{ steps.filter.outputs.image_api }}
        IMAGE_WEB: ${{ steps.filter.outputs.image_web }}
      run: |
        if [ "$FILTERED" != true ]; then
          CODE=true DEPS=true E2E=true IMAGE_API=true IMAGE_WEB=true
        fi
        apps=()
        [ "$IMAGE_API" = true ] && apps+=(api)
        [ "$IMAGE_WEB" = true ] && apps+=(web)
        matrix=$(printf '%s\n' "${apps[@]}" | jq -R . | jq -sc 'map(select(length > 0))')
        {
          echo "code=$CODE"
          echo "deps=$DEPS"
          echo "e2e=$E2E"
          echo "docker_matrix=$matrix"
        } >> "$GITHUB_OUTPUT"
        echo "code=$CODE deps=$DEPS e2e=$E2E docker=$matrix"
