name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.c.outputs.code }}
      e2e: ${{ steps.c.outputs.e2e }}
      docker_matrix: ${{ steps.c.outputs.docker_matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: c
        uses: ./.github/actions/changes

  check:
    name: Lint, typecheck, unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: bun run --filter @app/api keys:generate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:arch
      - run: bun run test
      - run: bun run build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: bun run --filter @app/api keys:generate
      - run: bun run infra:up
      - run: bun run --filter @app/api db:migrate
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore
      - name: Dump infra logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

  docker:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.docker_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.docker_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: elysia-architecture-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: elysia-architecture-${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
