# Path filters consumed by .github/actions/changes (dorny/paths-filter).
# Add new top-level code/config paths to `code`, or docs-only PRs and pushes will skip CI for them.

code:
  - apps/**
  - packages/**
  - docker/**
  - docker-compose.yml
  - .env.example
  - "*.json"
  - "*.toml"
  - bun.lock
  - .github/**

deps:
  - package.json
  - apps/*/package.json
  - packages/*/package.json
  - bun.lock

e2e:
  - apps/**
  - packages/**
  - docker/**
  - docker-compose.yml
  - .env.example
  - package.json
  - tsconfig.base.json
  - bun.lock
  - .github/workflows/ci.yml

# Mirrors the COPY instructions in apps/api/Dockerfile.
image_api:
  - apps/api/**
  - packages/**
  - package.json
  - tsconfig.base.json
  - bun.lock
  - .dockerignore
  - .github/workflows/ci.yml

# apps/web/Dockerfile does `COPY . .` and the web app imports @app/api types.
image_web:
  - apps/web/**
  - apps/api/**
  - packages/**
  - docker/nginx/**
  - package.json
  - tsconfig.base.json
  - bun.lock
  - .dockerignore
  - .github/workflows/ci.yml
